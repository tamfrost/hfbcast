services:
  app:
    image: ghcr.io/tamfrost/hfbcast:latest
    container_name: hfbcast-app
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA}
        APP_VERSION: ${APP_VERSION}
    ports:
      - 58080:8080
  apiserver:
    image: hfbcast-apiserver:latest
    container_name: hfbcast-apiserver
    build:
      context: .
      dockerfile: apiserver.dockerfile
    ports:
      - 8000:8000
  build-db:
    image: ghcr.io/tamfrost/hfbcast-db:latest
    container_name: hfbcast-db
    build:
      context: .
      dockerfile: build-database.dockerfile
      # args:
        # COMMIT_SHA: ${COMMIT_SHA}
        # APP_VERSION: ${APP_VERSION}

