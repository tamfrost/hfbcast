stages:
  - build
  - test
  - publish
  - deploy

# workflow:
#   rules:
#     - changes:
#         - src/**/*
        
build documentation:
  stage: build
  image: $IMAGE_REGISTRY_PATH_DSPDF/docker:20.10.16
  tags:
    - $GITLAB_RUNNER_DIND
  services:
    - name: $IMAGE_REGISTRY_PATH_DSPDF/docker:20.10.16-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - source .scripts/cicd/jobs.sh; build_doc
  artifacts:
    paths:
      - doc/index.html

# build database:
